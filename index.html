<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis - Roblox Scripter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --dark: #1e272e;
            --light: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        .navbar {
            background: rgba(30, 39, 46, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .hero {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
            background: linear-gradient(135deg, rgba(30, 39, 46, 0.9), rgba(30, 39, 46, 0.7));
        }

        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ccc;
        }

        .scripting-since {
            font-size: 0.9rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .highlight {
            color: var(--secondary);
            font-weight: bold;
        }

        .projects-section {
            padding: 4rem 2rem;
            background: var(--dark);
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: #242a31;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-image {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .project-discontinued {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 71, 87, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .project-content {
            padding: 1.2rem;
            text-align: center;
        }

        .project-title {
            color: var(--secondary);
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
        }

        .project-link {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .project-link:hover {
            background: #ff2e43;
        }

        .contact-section {
            padding: 3rem 2rem;
            background: #242a31;
            text-align: center;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--light);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            background: #2d3436;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .contact-link:hover {
            background: var(--primary);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #1a1f24;
            font-size: 0.8rem;
            color: #888;
        }

        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="logo">VEXIS</a>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>ROBLOX SCRIPTER</h1>
            <h2>Hi, I'm <span class="highlight">Vexis</span></h2>
            <div class="scripting-since">Scripting since 2025</div>
        </div>
    </section>

    <section id="projects" class="projects-section">
        <h2 class="section-title">PROJECTS</h2>
        <div class="projects-grid">
            
            <!-- Not an FPS -->
            <div class="project-card">
                <div class="project-image" style="background-image: url('fps-game.jpg.png');">
                    <div class="project-discontinued">DISCONTINUED</div>
                </div>
                <div class="project-content">
                    <h3 class="project-title">Not an FPS</h3>
                </div>
            </div>
            
            <!-- Detona -->
            <div class="project-card">
                <div class="project-image" style="background-image: url('detona.jpg.png');">
                </div>
                <div class="project-content">
                    <h3 class="project-title">Detona</h3>
                    <a href="https://www.roblox.com/games/129679815712387/Detona" class="project-link" target="_blank">Play</a>
                </div>
            </div>
            
            <!-- Sword Fighting Game -->
            <div class="project-card">
                <div class="project-image" style="background-image: url('sword-game.jpg.png'); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #0d1117;">
                    <div class="project-discontinued">DISCONTINUED</div>
                </div>
                <div class="project-content">
                    <h3 class="project-title">Sword Fighting Game</h3>
                </div>
            </div>
            
            <!-- Dust and Diesel -->
            <div class="project-card">
                <div class="project-image" style="background-image: url('DustandDiesel.png');">
                </div>
                <div class="project-content">
                    <h3 class="project-title">Dust and Diesel</h3>
                    <a href="https://www.roblox.com/games/78844921949169/Dust-And-Diesel" class="project-link" target="_blank">Play</a>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="contact-section">
        <h2 class="section-title">CONTACT</h2>
        <div class="contact-links">
            <a href="https://discord.com/users/1351938325245595769" class="contact-link" target="_blank">
                <i class="fab fa-discord"></i> Discord: officialvexis
            </a>
            <a href="mailto:vexisroblox4yt@gmail.com" class="contact-link">
                <i class="fas fa-envelope"></i> Email
            </a>
        </div>
    </section>

    <footer>
        <p>© 2026 Vexis | Scripting since 2025</p>
    </footer>

    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 70,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
